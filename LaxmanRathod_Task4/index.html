<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="loginTab" onclick="showLogin()">Login</button>
      <button class="tab-btn" id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <h2>Welcome Back</h2>

      <div class="input-group">
        <label for="loginEmail">Email</label>
        <input type="text" id="loginEmail" placeholder="Enter your email">
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="Enter your password">
          <span class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</span>
        </div>
      </div>

      <p class="message" id="loginMessage"></p>

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form hidden">
      <h2>Create Account</h2>

      <div class="input-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="Enter your name">
      </div>

      <div class="input-group">
        <label for="regEmail">Email</label>
        <input type="text" id="regEmail" placeholder="Enter your email">
      </div>

      <div class="input-group">
        <label for="regPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="regPassword" placeholder="Create a password">
          <span class="toggle-password" onclick="togglePassword('regPassword', this)">Show</span>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Re-enter your password">
          <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">Show</span>
        </div>
      </div>

      <p class="message" id="registerMessage"></p>

      <button type="submit" class="submit-btn">Register</button>
    </form>

  </div>

  <script src="script.js"></script>
</body>
</html>
